name: Test website interface

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/test-website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/test-website.yml'

permissions:
  contents: read

jobs:
  imports-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Flask 3.0 test dependencies
        run: >-
          python -m pip install
          Flask==3.0.3 Werkzeug==3.0.6
          flask-sqlalchemy flask-session flask-wtf flask-migrate flask-login
          requests python-dotenv
      - name: Check imports and exports on Flask 3.0
        run: |
          python -m unittest discover -s website/tests -p 'import_checks.py' -v
          python -m unittest discover -s website/tests -p 'export_checks.py' -v

  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/app/assets/package-lock.json
      - name: Build static assets
        working-directory: website/app/assets
        run: |
          npm ci
          npm run build:static
      - name: Verify generated assets are committed
        run: git diff --exit-code -- website/app/static
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install website test dependencies
        run: >-
          python -m pip install
          flask flask-sqlalchemy flask-session flask-wtf flask-migrate flask-login
          requests python-dotenv playwright poetry-core
      - name: Install browser and accessibility checker
        run: |
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/misp-ui-a11y" axe-core@4.14.0
      - name: Check browser workflows, responsive layouts, and accessibility
        env:
          AXE_SCRIPT_PATH: ${{ runner.temp }}/misp-ui-a11y/node_modules/axe-core/axe.min.js
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/misp-ui-screenshots
        run: python -m unittest discover -s website/tests -p '*_checks.py' -v
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-interface-screenshots
          path: ${{ runner.temp }}/misp-ui-screenshots
          if-no-files-found: ignore
