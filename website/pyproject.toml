# pyproject.toml
[build-system]
requires      = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

########################
# Project metadata     #
########################
[project]
name            = "misp-modules-website"
version         = "0.1.0"
description     = "Web application for MISP modules"
readme          = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
  { name = "MISP Contributors", email = "info@misp-project.org" },
]

# Runtime dependencies
dependencies = [
  "flask>=3.1.3",
  "sqlalchemy",
  "flask-session>=0.8.0",
  "flask-sqlalchemy>=3.1.1",
  "flask-wtf>=1.3.0",
  "flask-migrate>=4.1.0",
  "flask-login>=0.6.3",
  "wtforms",
  "werkzeug>=3.1.9",
  "flask-restx>=1.3.2",
  "python-dateutil>=2.9.0.post0,<3",  # pypssl requires dateutil <3
  "schedule>=1.2.2",
  "gunicorn>=26.2.0",
  "jsonschema>=4.26.0",
  "requests>=2.34.2",
  "tornado>=6.5.10,<6.6",  # published misp-modules 3.1.1 requires this range
  "certifi>=2026.10.23",
  "urllib3>=2.8.0",
  "Brotli>=1.2.1; platform_python_implementation == 'CPython'",
  "brotlicffi>=1.2.1.0; platform_python_implementation != 'CPython'",
  "python-dotenv>=1.2.4",
  "misp-modules[minimal]>=3.1.1",
]

# Entry‑point commands
[project.scripts]
mmw = "main:main"

########################
# Poetry‑specific bits #
########################
[tool.poetry]
packages = [
  { include = "app" }
]
include = [
  { path = "main.py", format = ["sdist", "wheel"] },
  { path = "migrations", format = ["sdist", "wheel"] },
]

################
# linting bits #
################
[tool.black]
exclude = "migrations"

[tool.isort]
profile = "black"
skip = ["migrations"]
