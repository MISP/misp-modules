# pyproject.toml
[build-system]
requires      = ["poetry-core>=1.9.0"]   # need ≥1.8 for PEP621 support
build-backend = "poetry.core.masonry.api"

########################
# Project metadata     #
########################
[project]
name            = "misp-modules-website"
version         = "0.1.0"
description     = "Web application for MISP modules"
readme          = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
  { name = "MISP Contributors", email = "info@misp-project.org" },
]

# Runtime dependencies
dependencies = [
  "flask",
  "sqlalchemy",
  "flask-session",
  "flask-sqlalchemy",
  "flask-wtf",
  "flask-migrate",
  "flask-login",
  "wtforms",
  "werkzeug",
  "flask-restx",
  "python-dateutil",
  "schedule",
  "gunicorn",
  "jsonschema",
  "requests",
  "tornado>=6.5.10,<6.6",
  "certifi>=2026.10.19",
  "urllib3>=2.8.0",
  "Brotli>=1.2.1; platform_python_implementation == 'CPython'",
  "brotlicffi>=1.2.1.0; platform_python_implementation != 'CPython'",
  "python-dotenv",   # package is called python‑dotenv on PyPI
  "misp-modules[minimal]",
]

# Entry‑point commands
[project.scripts]
mmw = "main:main"

########################
# Poetry‑specific bits #
########################
[tool.poetry]
packages = [
  { include = "app" }
]
include = [
  "main.py"
]

[tool.poetry.dependencies]
flask = "*"
sqlalchemy = "*"
flask-session = "*"
flask-sqlalchemy = "*"
flask-wtf = "*"
flask-migrate = "*"
flask-login = "*"
wtforms = "*"
werkzeug = "*"
flask-restx = "*"
python-dateutil = "*"
schedule = "*"
gunicorn = "*"
jsonschema = "*"
requests = "*"
tornado = ">=6.5.10,<6.6"
certifi = ">=2026.10.19"
urllib3 = ">=2.8.0"
Brotli = { version = ">=1.2.1", markers = "platform_python_implementation == 'CPython'" }
brotlicffi = { version = ">=1.2.1.0", markers = "platform_python_implementation != 'CPython'" }
dotenv = "*"
"misp-modules[minimal]" = "*"

################
# linting bits #
################
[tool.black]
exclude = "migrations"

[tool.isort]
profile = "black"
skip = ["migrations"]
